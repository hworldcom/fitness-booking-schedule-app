[package]
name = "movx-coach-pass"
version = "0.1.0"
description = "Coach authority and immutable private-training offers for MovX Club"
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "movx_coach_pass"

[features]
default = []
anchor-debug = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["event-cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("custom-heap", "custom-panic"))',
] }
